<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Study tools</title
  ><style>
    :root {
      color-scheme: dark;
      font: 14px/1.4 system-ui;
      background: #222a32;
      color: #eff4f3;
    }
    * {
      box-sizing: border-box;
    }
    body {
      padding: 12px;
      margin: 0;
    }
    h1 {
      font-size: 17px;
      margin: 0 0 10px;
    }
    label {
      display: grid;
      gap: 4px;
      color: #bfcbd0;
      font-size: 12px;
    }
    select,
    input,
    button {
      font: inherit;
      color: inherit;
      background: #172025;
      border: 1px solid #4a575d;
      border-radius: 5px;
      padding: 7px;
      min-width: 0;
    }
    button {
      cursor: pointer;
    }
    select,
    input {
      width: 100%;
      height: 32px;
    }
    label:has(> select) { position: relative; }
    label > select {
      appearance: none;
      padding-inline-end: 26px;
    }
    label:has(> select)::after {
      content: "";
      position: absolute;
      right: 11px;
      bottom: 14px;
      width: 6px;
      height: 6px;
      border: solid currentColor;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
      pointer-events: none;
    }
    #fields label {
      align-content: space-between;
    }
    @media (pointer: coarse) {
      select, input, #insert { min-height: 44px; }
      label:has(> select)::after { bottom: 20px; }
    }
    #fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    p {
      margin: 9px 0;
      color: #c5d3d5;
    }
    output {
      display: block;
      color: #d9f4ee;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-top: 10px;
      font-weight: 550;
    }
    #insert {
      margin-top: 12px;
      background: #375e56;
    }
    #scroll {
      overflow: auto;
      padding: 6px 0;
      max-height: 240px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(18, 32px);
      gap: 2px;
    }
    .element {
      font-size: 11px;
      padding: 2px;
      min-height: 32px;
      line-height: 1.1;
    }
    .element small {
      display: block;
      font-size: 8px;
    }
    .element[aria-pressed="true"] {
      background: #34665b;
      outline: 1px solid #80caba;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #78cebd;
    }
    #formula:empty,
    #fields:empty {
      display: none;
    }
    #periodic input {
      margin-top: 7px;
    }
    #insert {
      align-self: flex-start;
    }
    [hidden] {
      display: none !important;
    }

    html.cartoon {color-scheme:light;background:#f6f2e8;color:#282620}
    .cartoon h1{font-family:Georgia,serif}
    .cartoon select,.cartoon input,.cartoon button{background:#fffdf7;color:#282620;border-color:#958e80}
    .cartoon label,.cartoon p,.cartoon output,.cartoon #result{color:#3c382e}
    .cartoon #insert,.cartoon .element[aria-pressed=true]{color:#fffdf7;background:#292823}
    .cartoon #scroll{background:#e8e3d7}
  </style>
  <link rel="stylesheet" href="themes.css" />
  <body hidden>
  <h1 id="major"></h1>
  <label>Tool<select id="tool"></select></label>
  <p id="formula"></p>
  <div id="fields"></div>
  <div id="periodic" hidden>
    <input
      id="search"
      aria-label="Find an element"
      placeholder="Find by symbol, name or atomic number"
    />
    <div id="scroll"><div class="grid" id="grid"></div></div>
  </div>
  <output id="result" aria-live="polite"></output
  ><button id="insert" hidden>Insert in notebook</button>
  <script src="elements.js"></script>
  <script src="solver.js"></script>
  <script src="appearance.js"></script>
  <script src="majors.js"></script>
  <script src="subjects.js"></script>
  </body>
</html>
