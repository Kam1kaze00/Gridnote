<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gridnote</title>
    <link rel="stylesheet" href="launcher.css" />
    <link rel="stylesheet" href="themes.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #181f24;
      }
      #launcher {
        display: block;
        width: 100vw;
        height: 100vh;
        padding: 0;
        overflow: hidden auto;
      }
      #launcher .start-card {
        box-sizing: border-box;
        /* Keep the layout stable while WebKit briefly shows a scrollbar during a resize. */
        width: 100vw;
        max-width: none;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main id="launcher" class="launcher-host"></main>
    <script src="appearance.js"></script>
    <script src="majors.js"></script>
    <script src="launcher.js"></script>
    <script>
      const bridge = window.webkit?.messageHandlers?.gridnoteLauncher;
      if (!bridge) location.replace("./");
      else {
        GridnoteLauncher.mount(document.getElementById("launcher"), {
          ...window.launchOptions,
          changeTheme: (theme) => bridge.postMessage({ action: "theme", theme }),
          change: (major) => bridge.postMessage({ action: "major", major }),
          start: (action) => bridge.postMessage({ action }),
        });
        const card = document.querySelector(".start-card");
        new ResizeObserver(() => {
          bridge.postMessage({
            action: "fit",
            height: String(Math.ceil(card.getBoundingClientRect().height)),
          });
        }).observe(card);
      }
    </script>
  </body>
</html>
