<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2027" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Gridnote</title>
    <link rel="icon" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <button id="files" title="Notebook menu" aria-label="Notebook menu">
        <img src="./assets/icon-192.png" alt="" /><span id="name">Gridnote</span
        ><span class="chevron">⌄</span>
      </button>
      <div class="spacer"></div>
      <button id="saved" hidden>Saved</button
      ><button
        id="subjects"
        aria-label="Study tools"
        title="Study tools"
        hidden
      >
        Study tools</button
      ><button id="solve" class="document secondary" hidden>Solve</button
      ><button id="preview" class="document secondary" hidden>
        Preview PDF</button
      ><button id="export" class="document primary" hidden>Export PDF</button>
    </header>
    <nav id="tools" aria-label="Notebook tools" hidden>
      <div class="group" id="toolset"></div>
      <div class="spacer"></div>
      <div id="inks" class="group"></div>
      <button
        id="palette"
        aria-label="Toggle color palette"
        title="Color palette"
      >
        ◉</button
      ><button id="addimage" aria-label="Import image" title="Import image">
        ▧</button
      ><button
        id="settings"
        aria-label="Writing device and settings"
        title="Writing device and settings"
      >
        ☷
      </button>
    </nav>
    <main id="welcome">
      <div class="welcome">
        <img src="./assets/icon-192.png" width="74" height="74" alt="" />
        <h1>Gridnote</h1>
        <p>Write on grid paper or annotate a PDF.</p>
        <p id="detected-device" hidden></p>
        <div class="welcome-actions">
          <button id="new" class="primary" disabled>＋ New Notebook</button
          ><button id="open" class="secondary" disabled>Open…</button>
        </div>
        <div id="recents"></div>
      </div>
    </main>
    <main id="stage" hidden>
      <aside id="pages-panel" aria-label="Pages" hidden>
        <strong>Pages</strong>
        <div class="page-actions">
          <button
            data-action="insert"
            aria-label="Insert page after"
            title="Insert page after"
          >
            ＋</button
          ><button
            data-action="up"
            aria-label="Move page earlier"
            title="Move earlier"
          >
            ↑</button
          ><button
            data-action="down"
            aria-label="Move page later"
            title="Move later"
          >
            ↓</button
          ><button
            data-action="delete"
            aria-label="Delete selected page"
            title="Delete page"
          >
            −
          </button>
        </div>
        <div class="page-list"><div class="page-rows"></div></div>
      </aside>
      <div id="view">
        <div id="world">
          <canvas id="sheet" tabindex="0" aria-label="Notebook paper"></canvas
          ><button id="code-toggle" aria-label="Toggle syntax colors" hidden>
            &lt;/&gt;</button
          ><textarea id="editor" aria-label="Notebook text" hidden></textarea>
        </div>
      </div>
    </main>
    <footer id="bottom" hidden>
      <button
        id="page"
        title="Page thumbnails"
        aria-label="Pages"
        aria-expanded="false"
      >
        Page 1</button
      ><i></i><button id="paper">A4 · Grid ⌄</button
      ><button id="undo" title="Undo" aria-label="Undo">↶</button
      ><button id="redo" title="Redo" aria-label="Redo">↷</button
      ><button id="selection" hidden>Selection</button>
      <div class="spacer"></div>
      <button id="zoomout" aria-label="Zoom out">−</button
      ><span id="zoom">100%</span
      ><button id="zoomin" aria-label="Zoom in">＋</button
      ><button id="fit">Fit Width</button>
    </footer>
    <section id="popover" role="dialog" hidden></section>
    <dialog id="pdfmodal">
      <div class="pdf-toolbar">
        <b>PDF Preview</b>
        <div class="spacer"></div>
        <button id="pdfclose">Close</button
        ><button id="pdfshare">Share PDF</button
        ><button id="pdfsave" class="primary">Save PDF</button>
      </div>
      <div class="pdfpage"><canvas id="pdfcanvas"></canvas></div>
      <div class="pdf-toolbar">
        <button id="pdfprev" aria-label="Previous page">‹</button
        ><span id="pdfcount"></span
        ><button id="pdfnext" aria-label="Next page">›</button>
      </div>
    </dialog>
    <input
      id="file"
      type="file"
      accept=".gridnote,.pdf,application/pdf"
      hidden
    /><input id="imagefile" type="file" accept="image/*" multiple hidden />
    <div id="notice" role="status" hidden></div>
    <script src="./solver.js"></script>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
