<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gridnote · Theme gallery</title>
    <link rel="stylesheet" href="../themes.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header>
      <a class="home" href="../"
        ><img
          id="logo"
          alt=""
          width="28"
          height="28"
          src="../assets/pen-mark.svg"
        />Gridnote</a
      ><a href="https://github.com/Kam1kaze00/Gridnote">GitHub ↗</a>
    </header>
    <main>
      <h1>Theme gallery</h1>
      <div id="choices" role="group" aria-label="Choose a theme"></div>
      <section aria-labelledby="title">
        <div class="caption">
          <div>
            <h2 id="title">Default</h2>
            <p id="description"></p>
          </div>
          <div class="views" role="group" aria-label="Preview screen">
            <button aria-pressed="true" data-view="editor">Notebook</button
            ><button aria-pressed="false" data-view="launcher">Launcher</button>
          </div>
        </div>
        <figure>
          <img
            id="screen"
            src="../images/default-editor.png"
            alt="Default notebook preview"
          />
        </figure>
      </section>
    </main>
    <script src="../appearance.js"></script>
    <script src="gallery.js"></script>
  </body>
</html>
